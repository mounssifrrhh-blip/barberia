</head><body><div id="stage"></div><header><h1>El sillón definitivo</h1><p>BARBER SHOP · ESTUDIO DE MODELO 3D</p></header><div class="corner">PROTOTIPO AISLADO<br>BASE FIJA · ASIENTO GIRATORIO</div><div id="status">Preparando sillón 3D…</div>

for(let i=0;i<38000;i++){let x=rand()*512,y=rand()*512,r=rand()*1.8+.15;cx.fillStyle=rand()>.5?'#dad8d1':'#77746e';cx.globalAlpha=.06+rand()*.16;cx.fillRect(x,y,r,r)}cx.globalAlpha=1;

function tube(p,pts,r,m){const curve=new THREE.CatmullRomCurve3(pts.map(q=>new THREE.Vector3(...q)));return part(p,new THREE.TubeGeometry(curve,60,r,10,false),m)}

// Heavy beveled base and hydraulic column remain in the world coordinate system.
const footProfile=[[0,0],[.49,0],[.58,.011],[.61,.025],[.61,.048],[.59,.058],[.54,.069],[.43,.085],[.24,.12],[.16,.145],[0,.145]];

tube(back,[[-.45,.085,.18],[-.22,.11,.192],[0,.115,.195],[.22,.11,.192],[.45,.085,.18]],.0038,thread);

for(const x of [-.40,.40]){const cap=cyl(head,.167,.167,.009,leatherSide,x,0,0,64);cap.rotation.z=Math.PI/2;const bolt=cyl(head,.047,.047,.012,bronze,x+(x>0?.012:-.012),0,0,48);bolt.rotation.z=Math.PI/2}
const headSeam=part(head,new THREE.TorusGeometry(.178,.004,8,64),thread,.31,0,0);headSeam.rotation.y=Math.PI/2;
// Forged curved metal arm frames with substantial leather rolls.
for(const side of [-1,1]){
 const x=side*.785;
 rail(swivel,[[x*.92,.82,-.38],[x,1.04,-.40],[x,1.39,-.34],[x,1.445,-.27]],.043,bronze);
 rail(swivel,[[x*.92,.83,.43],[x,1.01,.49],[x,1.39,.47],[x,1.44,.43]],.039,steel);
 box(swivel,.21,.09,1.00,.04,champagne,x,1.46,.08);
 box(swivel,.205,.135,.97,.06,leather,x,1.53,.075);
 box(swivel,.10,.16,.89,.03,bronze,x,.905,.035);
 const fast=cyl(swivel,.028,.028,.013,champagne,x+side*.05,.99,-.36);fast.rotation.z=Math.PI/2;
}
// Forward projecting angled footrest (all rotates WITH the seat).
for(const side of [-1,1])rail(swivel,[[side*.40,.83,.48],[side*.36,.32,1.03],[side*.40,.22,1.21]],.036,steel);
const leg=new THREE.Group();leg.position.set(0,.56,.815);leg.rotation.x=-.55;swivel.add(leg);
box(leg,.94,.58,.14,.045,darkSteel,0,0,0);
box(leg,.90,.55,.15,.06,leather,0,0,.035);

const c=document.createElement('canvas');c.width=c.height=256;const context=c.getContext('2d'),gr=context.createRadialGradient(128,128,6,128,128,125);gr.addColorStop(0,'#000b');gr.addColorStop(.6,'#0007');gr.addColorStop(1,'#0000');context.fillStyle=gr;context.fillRect(0,0,256,256);
const shadow=part(scene,new THREE.PlaneGeometry(2.2,2.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,opacity:.6,depthWrite:false}),0,.004,0);shadow.rotation.x=-Math.PI/2;shadow.castShadow=false;
const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.minDistance=4.15;controls.maxDistance=10;controls.maxPolarAngle=Math.PI*.51;controls.minPolarAngle=.55;controls.enableDamping=true;controls.dampingFactor=.06;controls.target.set(0,1.42,0);

function initial(){const mobile=innerWidth<640;view(mobile?3.25:3.15,2.55,mobile?8.7:6.7)}
initial();
document.getElementById('front').onclick=()=>view(0,2.45,6.8);

let moving=!matchMedia('(prefers-reduced-motion:reduce)').matches,highlight=false;
const turn=document.getElementById('turn');function sync(){turn.textContent=moving?'Pausar giro':'Activar giro';turn.setAttribute('aria-pressed',String(moving))}
turn.onclick=()=>{moving=!moving;sync()};sync();
document.getElementById('base').onclick=()=>{highlight=!highlight;fixed.traverse(o=>{if(o.isMesh&&o.material!==darkSteel){if(!o.userData.original)o.userData.original=o.material;o.material=highlight?new THREE.MeshStandardMaterial({color:0x42b0b2,metalness:.6,roughness:.3}):o.userData.original}});msg.textContent=highlight?'La parte turquesa permanece fija: solo gira el asiento superior.':'Arrastra para inspeccionar la silla · La base debe permanecer totalmente inmóvil.'};

requestAnimationFrame(animate);

}catch(e){status.textContent='No se ha podido cargar el modelo 3D: '+e.message;console.error(e)}
